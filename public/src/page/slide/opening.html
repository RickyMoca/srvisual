{% for item in opening %}
<!-- Opening  -->
 <li class="satumomen_slide" id="opening">
    <div class="container-mobile" style="background-image:url('{{ item.bg }}')">
            <div style="position:absolute;inset:0;z-index:0;background-size:100% 100%;"></div>
        <div class="d-flex justify-content-center flex-column align-items-center">
            <div style="height:200p;width:200px;overflow:hidden;" class="mb-4 image-editable mx-auto animate__animated animate__fadeInDown animate__slower">
                <img src="{{ item.img }}" style="width: 100%;height: 100%;object-fit: cover;" alt="no-image.jpg"/>
            </div>
            <div style="width:100%;">
                <div class="text-center animate__animated animate__fadeInUp animate__slower">
                    <div class="editable font-italic mb-3 color-accent font-latin" style="font-size:42px;">Seny & Ricky</div>
                    <div class="editable quotes" style="font-size:12.4px;">
                        {{ item.quote }}
                        <br/><br/>
                        {{ item.tagQuote }}

                    </div>
                </div>
            </div>
        </div>
    </div>
</li>
{% endfor %}
