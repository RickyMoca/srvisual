{% for item in opening %}
<li class="satumomen_slide" id="opening">
    <div class="container-mobile">
        <div style="background-image:url('{{ item.bg }}');position:absolute;inset:0;z-index:0;background-size:cover;"> </div>

        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div class="text-center" style="width: 100%;">
                <div class="polaroid mb-4 mx-auto animate__animated animate__fadeInDown animate__slower" style="height:200p;width:200px;overflow:hidden;">
                    <p class="font-base">Seny & Ricky</p>
                    <img src="{{ item.img }}" style="width: 100%;height: 100%;object-fit: cover;" alt="no-image.jpg" />
                </div>
        
                <div style="width:100%;">
                    <div class="text-center animate__animated animate__fadeInUp animate__slower">

                        <div class="editable" style="font-size:12.4px;">
                            <div class="card-quote">
                                {{ item.quote }}
                                <br /><br />

                                <p class="subtitle-quote">{{ item.tagQuote }}</p>
                            </div>


                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</li>
{% endfor %}
