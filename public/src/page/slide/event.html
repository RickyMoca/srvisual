<li class="satumomen_slide" id="event">
    <div class="container-mobile">
        <div style="background-image:url('{{event.bg}}');position:absolute;inset:0;z-index:0;background-size:cover;"></div>
        <div class="position-relative h-70 d-flex justify-content-center align-items-center" style="z-index:1;">
            <div style="width:100%;">
                {% for item in event.detail %}
                <div class="text-center mb-4  mt-4 animate__animated animate__fadeInLeft animate__slower">
                    <div class="editable font-latin" style="font-size:45px;">{{ item.name}}</div>
                    <div class="editable" style="font-size:13px;">{{ item.date}}</div>
                    <div class="editable" style="font-size:15px;">{{ item.time}}</div>
                    <div class="editable" style="font-size:13px;">{{ item.location}}</div>
                    <div class="editable" style="font-size:13px;">{{ item.description}}</div>
                </div>
                {% endfor %}
               
                <div class="countdown-wrapper d-flex flex-column" data-datetime="{{ countdown }}">
                    <div class="countdown text-center animate__animated animate__fadeInLeft animate__slower">
                        <div class="countdown-item day">
                            <div class="number">00</div>
                            <div class="text font-latin">Hari</div>
                        </div>
                        <div class="countdown-item hour">
                            <div class="number">00</div>
                            <div class="text font-latin">Jam</div>
                        </div>
                    </div>
                    <div class="countdown text-center mt-2 animate__animated animate__fadeInRight animate__slower">
                        <div class="countdown-item minute">
                            <div class="number">00</div>
                            <div class="text font-latin">Menit.</div>
                        </div>
                        <div class="countdown-item second">
                            <div class="number">00</div>
                            <div class="text font-latin">Detik.</div>
                        </div>
                    </div>
                </div>
                <div class="text-center animate__animated animate__fadeInUp animate__slower">
                    <a href="https://calendar.google.com/calendar/u/0/r/eventedit?text=&amp;dates=&amp;details=&amp;location=" target="_blank" class="btn-reminder btn btn-primary rounded-pill my-3" rel="noreferrer noopener">Add to Calendar</a>
                </div>
            </div> 
        </div>
    </div>
</li>
