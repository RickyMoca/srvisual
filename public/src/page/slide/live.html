<li class="satumomen_slide" id="event">
    <div class="container-mobile">
        <div  style="background-image:url('{{live.bg}}');position:absolute;inset:0;z-index:0;background-size:cover;"></div>
        
        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div class="text-center" style="width: 100%;">
                <div class="title font-latin text-center color-accent animate__animated animate__fadeInDown animate__slower">{{live.title}}</div>
                {% for item in live.detail %}
                <div class="editable animate__animated animate__fadeInUp animate__slower">{{item.description}}</div>
                <div class="editable animate__animated animate__fadeInUp animate__slower my-3"> 
                    <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/a/a5/Instagram_icon.png/2048px-Instagram_icon.png"
                    alt="2048px-Instagram_icon.png" style="width: 20%; height: 20%; object-fit: cover;"> 
                </div>
               
                <div class="editable animate__animated animate__fadeInUp animate__slower mb-3" style="font-size: 14.4px;"> Instagram : <br> @{{item.account}}</div>
                <a href="https://instagram.com/{{item.account}}" target="_blank" rel="noreferrer noopener"
                    class="link btn btn-primary rounded-pill  animate__animated animate__fadeInUp animate__slow">{{item.btn}} </a>
            </div>
        </div>
    </div>
</li>


{% endfor %}
