<li class="satumomen_slide">
    <div class="container-mobile " style="background-image: url(/assets/bg-primary.webp); ;">
        <div style="background-image:url(/themes/green-passport/bg-simple.webp);position:absolute;inset:0;z-index:0;background-size:cover;"></div>
        <div class="h-70  position-relative d-flex justify-content-center align-items-center">
            <div style="width:100%;">
                {% for item in location %}
                <div>
                    <div style="width:100%;margin:auto;border-radius:10px;overflow:hidden;margin-bottom:5px;padding-bottom:100%;position:relative;" class="animate__animated animate__fadeInDown animate__slow">
                        <iframe width="100%" height="100%" style="border:0;position:absolute;" allowfullscreen="" src="{{item.maps_url}}" class="maps-embed"></iframe>
                    </div>
                    <div class="text-center animate__animated animate__fadeInUp animate__slow">
                        <div class="editable color-accent font-latin" style="font-size:25px;">{{item.name}}</div>
                        <div class="editable mb-3" style="font-size:12px;">{{item.address}}</div>
                        <a href="{{item.maps_link}}" class="btn-maps-link btn btn-primary rounded-pill mb-4 animate__animated animate__fadeInUp animate__slow" target="_blank" rel="noreferrer noopener">Petunjuk Ke Lokasi</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</li>
