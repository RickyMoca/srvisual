{% for item in bride %}
<li class="satumomen_slide" id="bride">
    <div class="container-mobile">
                <div class="editable text-left animate__animated animate__fadeInDown animate__slower mb-3 font-latin" style="font-size:40px;line-height:1;">Wedding Profile</div>
                <div class="d-flex flex-row justify-content-start align-items-end mb-5" style="gap:24px;">
                    <div style="height:190px;width:130px;min-width:130px;overflow:hidden;" class="image-editable animate__animated animate__fadeInDown animate__slower">
                        <img class="img-bride-groom" src="{{ item.photo }}" alt="{{ item.photo }}"/>
                    </div>
                    <div class="kotak-satu">
                        <div class="text-left animate__animated animate__fadeInDown animate__slower mb-2">
                            <div class="editable color-accent" style="font-size:14.4px;">TYPE</div>
                            <div class="editable" style="font-size:14.4px;">{{ item.type }}</div>
                        </div>
                        <div class="text-left animate__animated animate__fadeInDown animate__slower mb-2">
                            <div class="editable color-accent" style="font-size:14.4px;">CODE</div>
                            <div class="editable" style="font-size:14.4px;">LOVE</div>
                        </div>
                        <div class="text-left animate__animated animate__fadeInDown animate__slower">
                            <div class="editable color-accent" style="font-size:14.4px;">PASSPORT NO.</div>
                            <div class="editable" style="font-size:14.4px;">14-12-2024</div>
                        </div>
                    </div>
                </div>
                <div class="kotak-dua">
                    <div class="text-left animate__animated animate__fadeInUp animate__slower mb-2">
                        <div class="editable color-accent" style="font-size:14.4px;">NAME</div>
                        <div class="editable" style="font-size:14.4px;">{{ item.name }}</div>
                    </div>
                    <div class="text-left animate__animated animate__fadeInUp animate__slower mb-2">
                        <div class="editable color-accent" style="font-size:14.4px;">PUTRI DARI</div>
                        <div class="editable" style="font-size:14.4px;">{{ item.putraDari }}</div>
                    </div>
                    <div class="text-left animate__animated animate__fadeInUp animate__slower">
                        <div class="editable color-accent" style="font-size:14.4px;">DESCRIPTION</div>
                        <div class="editable" style="font-size:14.4px;">@{{ item.description  }}</div>
                    </div>
                </div>
            </div>
        </li>
{% endfor %}
