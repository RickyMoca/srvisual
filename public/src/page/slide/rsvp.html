<li class="satumomen_slide">
    <div class="container-mobile " style="background-image: url('{{rsvp.bg}}'); ;">
        <div style="position:absolute;inset:0;z-index:0;background-size:100% 100%;"></div>
        <div class="h-100 position-relative d-flex justify-content-center align-items-center">
            <div class="w-100 px-4">
                <div class="animate__animated animate__fadeInRight animate__slower">
                    <div class="image-editable" style="width:248px;height:195px;margin:auto;overflow:hidden;transform:translate(15px, 45px) rotate(356deg);border:4px solid var(--inv-border);box-shadow:#5f775d3d -11px 20px 20px;">
                        <img src="{{rsvp.img1}}" style="width: 100%; height: 100%; object-fit: cover" alt="no-image.jpg"/>
                    </div>
                </div>
                <div class="animate__animated animate__fadeInLeft animate__slower">
                    <div class="image-editable" style="width:248px;height:195px;margin:auto;overflow:hidden;margin-bottom:20px;transform:translate(-13px, 0px) rotate(4deg);border:4px solid var(--inv-border);box-shadow:#5f775d3d 6px 7px 20px;">
                        <img src="{{rsvp.img2}}" style="width: 100%; height: 100%; object-fit: cover" alt="no-image.jpg"/>
                    </div>
                </div>
                <div class="text-center">
                    <div class="editable mb-4 animate__animated animate__fadeInUp animate__slower" style="font-size:13px;">
                        {{rsvp.text}}
                    </div>
                    <button class="px-4 btn-rsvp btn btn-dark rounded-pill mb-4 animate__animated animate__fadeInUp animate__slow" style="font-size:14px;">{{rsvp.title}}</button>
                </div>
            </div>
        </div>
    </div>
</li>
