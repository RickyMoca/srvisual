<li class="satumomen_slide" id="gallery">
    <div class="container-mobile ">
        <div style="background-image:url('{{ event.bg }}');position:absolute;inset:0;z-index:0;background-size:cover;"> </div>
        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div style="width:100%;">
                <div class="text-center mb-4 animate__animated animate__fadeInDown animate__slower">
                    <div class="color-accent h4 mb-2 editable font-latin" style="font-size:46px;color:--inv-base;">Our Gallery</div>
                </div>
                <div class="image-editable d-flex flex-wrap">
                    {% for item in gallery.img %}
                    <div style="width:33.33%;overflow:hidden;padding:4px;" class="animate__animated animate__zoomIn animate__slower">
                        <div class="light" style="overflow:hidden;width:100%;height:140px;">
                            <img src="{{ item.img }}" style="width: 100%;height: 100%;object-fit: cover;" class="lightbox" alt="no-image.jpg"/>
                        </div>
                    </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</li>
