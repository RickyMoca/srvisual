<li class="satumomen_slide">
    <div class="container-mobile " style="background-image: url(/assets/img/img-bg/bg-primary.webp)">
        <div style="position:absolute;inset:0;z-index:0;background-size:100% 100%;"></div>
        <div class="h-100 position-relative watermark d-flex justify-content-center align-items-center">
            {% for item in thanks %}
            <div class="text-center w-100">
                <div class="editable quotes mb-3 animate__animated animate__fadeInDown animate__slower" style="font-size:14px;">{{item.description}}</div>
                <div class="editable font-italic animate__animated animate__fadeInDown animate__slow" style="font-size:14.4px;">Kami Yang Berbahagia,</div>
                <div class="editable h4 color-accent animate__animated animate__fadeInDown animate__slow font-latin" style="font-size:42px;color:rgb(242, 157, 145);">{{item.name}}</div>
                <div class="watermark-placeholder mt-5">
                    <div class="mt-5" style="display:inherit;">
                        <div class="editable animate__animated animate__fadeInDown animate__slow mb-3" style="font-size:14.4px;">Reach us at</div>
                        <div class="d-flex justify-content-center animate__animated animate__fadeInDown animate__slower" style="gap:8px;">
                            <a href="https://wa.me/821030800911" target="_BLANK" rel="nofollow noreferrer noopener" class="image-link" style="background-size:contain;background-repeat:no-repeat;width:32px;height:32px;"></a>
                            <a href="https://www.instagram.com/vickyyeb_/" target="_BLANK" rel="nofollow noreferrer noopener" class="image-link" style="background-size:contain;background-repeat:no-repeat;width:32px;height:32px;"></a>
                        </div>
                        <div class="mt-3">
                            <div style="height:50px;overflow:hidden;" class="image-editable">
                                <img src="https://assets.satumomen.com/images/galleries/345723-gallery-13BP2fHRhu.png" style="width: 100%;height: 100%;object-fit: contain;" alt="no-image.jpg"/>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</li>
