<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hanzi Writer - mandarinbdg.id</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.2/dist/hanzi-writer.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    #hanzi-target {
      width: 100%;
      max-width: 500px;
      height: 500px;
      margin: auto;
     background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="500" height="500"><rect x="0" y="0" width="500" height="500" fill="none" stroke="%23DDD" stroke-width="2"/><line x1="0" y1="0" x2="500" y2="500" stroke="%23DDD"/><line x1="500" y1="0" x2="0" y2="500" stroke="%23DDD"/><line x1="250" y1="0" x2="250" y2="500" stroke="%23DDD"/><line x1="0" y1="250" x2="500" y2="250" stroke="%23DDD"/><text x="470" y="490" font-size="16" text-anchor="end" fill="%23DDD" font-family="Arial">mandarinbdg.id</text></svg>');
      background-size: cover;
      background-repeat: no-repeat;
    }
    #target {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
    }

       /* Reset gaya default range */
    input[type=range] {
      -webkit-appearance: none; /* Chrome/Safari/Edge */
      width: 100%;
      height: 6px;
      background: #ddd;
      border-radius: 5px;
      outline: none;
    }

    /* Chrome, Edge, Safari */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 20px;
      height: 20px;
      background: red;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      margin-top: -7px; /* penting agar thumb tepat sejajar */
    }

    /* Firefox */
    input[type=range]::-moz-range-thumb {
      width: 20px;
      height: 20px;
      background: red;
      border: none;
      border-radius: 50%;
      cursor: pointer;
    }
  </style>
</head>
<body>

<div class="container py-4">


  <div class="row">
    
    <!-- Form Input -->
    <div class="col-md-4 mb-4">
      <div class="card shadow-sm">
        <div class="card-body">
            <!-- Logo dan Judul -->
  <div class="text-center mb-4">
    <h2>
      <img src="mandarinbdg/logo.png" alt="Logo" style="width: 50px; height: auto; vertical-align: middle; margin-right: 10px;">
      mandarinbdg.id
    </h2>
  </div>
          <div class="mb-3">
            <label for="hanzi-char" class="form-label">Karakter Hanzi:</label>
            <input type="text" id="hanzi-char" class="form-control" value="爱" maxlength="1">
          </div>
          <div class="mb-3">
            <label for="stroke-delay" class="form-label">Delay antar Stroke (ms):</label>
            <input type="number" id="stroke-delay" class="form-control" value="1000">
          </div>
          <div class="mb-3">
            <label for="loop-delay" class="form-label">Delay antar Loop (ms):</label>
            <input type="number" id="loop-delay" class="form-control" value="1000">
          </div>
          <div class="mb-3">
            <label for="start-delay" class="form-label">Delay sebelum animasi mulai (ms):</label>
            <input type="number" id="start-delay" class="form-control" value="5000">
          </div>
          <div class="mb-3">
            <label for="animation-speed" class="form-label">
              Kecepatan Animasi: <span id="speed-value">1</span>
            </label>
            <input type="range" class="form-range" min="0.5" max="5" step="0.5" id="animation-speed" value="1">
          </div>
          <button onclick="renderHanzi()" class="btn btn-danger w-100">Tampilkan</button>
        </div>
      </div>
    </div>

    <!-- Animasi dan Stroke -->
    <div class="col-md-8">
      <div id="hanzi-target" class="mb-4"></div>
      <div id="target"></div>
    </div>
  </div>
</div>

<script>
  let writer;

  document.getElementById('animation-speed').addEventListener('input', function () {
    document.getElementById('speed-value').textContent = this.value;
  });

  function renderHanzi() {
    renderHanzi2();
    const char = document.getElementById('hanzi-char').value.trim();
    const strokeDelay = parseInt(document.getElementById('stroke-delay').value);
    const loopDelay = parseInt(document.getElementById('loop-delay').value);
    const startDelay = parseInt(document.getElementById('start-delay').value);
    const animationSpeed = parseFloat(document.getElementById('animation-speed').value);

    if (!char) {
      alert("Masukkan karakter Hanzi.");
      return;
    }

    document.getElementById('hanzi-target').innerHTML = '';

    writer = HanziWriter.create('hanzi-target', char, {
      width: 500,
      height: 500,
      padding: 10,
      showOutline: true,
      delayBetweenStrokes: strokeDelay,
      delayBetweenLoops: loopDelay,
      strokeAnimationSpeed: animationSpeed,
      radicalColor: '#000000',
      strokeColor: '#000000',
      drawingColor: '#980001',
      highlightColor: '#980001'
    });

    setTimeout(() => {
      writer.loopCharacterAnimation();
    }, startDelay);
  }

  function renderFanningStrokes(target, strokes) {
    var svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.style.width = '100px';
    svg.style.height = '100px';
    svg.style.border = '1px solid #EEE';
    svg.style.marginTop = '5px';
    var group = document.createElementNS('http://www.w3.org/2000/svg', 'g');

    var transformData = HanziWriter.getScalingTransform(75, 75);
    group.setAttributeNS(null, 'transform', transformData.transform);
    svg.appendChild(group);

    strokes.forEach(function(strokePath) {
      var path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttributeNS(null, 'd', strokePath);
      path.style.fill = '#555';
      group.appendChild(path);
    });

    target.appendChild(svg);
  }

  function renderHanzi2() {
    document.getElementById('target').innerHTML = '';
    const char = document.getElementById('hanzi-char').value.trim();
    HanziWriter.loadCharacterData(char).then(function(charData) {
      var target = document.getElementById('target');
      for (var i = 0; i < charData.strokes.length; i++) {
        var strokesPortion = charData.strokes.slice(0, i + 1);
        renderFanningStrokes(target, strokesPortion);
      }
    });
  }
</script>

</body>
</html>
