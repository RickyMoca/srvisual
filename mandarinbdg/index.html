<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hanzi Writer - mandarinbdg.id</title>
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@2.2/dist/hanzi-writer.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    #hanzi-target {
      width: 100%;
      max-width: 500px;
      height: 500px;
      margin: auto;
    }
  </style>
</head>
<body>

<div class="container py-4">
  
  <div class="row">
    <!-- Form Input -->
    <div class="col-md-4">
      <div class="card shadow-sm">
        <div class="card-body">
         
          <div class="mb-3">
            <h2><img src="logo.png" alt="Logo" style="width: 70px; height: auto; vertical-align: middle; margin-left: 8px;"> mandarinbdg.id</h2>
         
          </div>
          <div class="mb-3">
           <label for="stroke-delay" class="form-label">Karakter Hanzi :</label>
            <input type="text" id="hanzi-char" class="form-control" value="爱" maxlength="1">
          </div>
          <div class="mb-3">
            <label for="stroke-delay" class="form-label">Delay antar Stroke (ms):</label>
            <input type="number" id="stroke-delay" class="form-control" value="1000">
          </div>
          <div class="mb-3">
            <label for="loop-delay" class="form-label">Delay antar Loop (ms):</label>
            <input type="number" id="loop-delay" class="form-control" value="1000">
          </div>
          <div class="mb-3">
            <label for="start-delay" class="form-label">Delay sebelum animasi mulai (ms):</label>
            <input type="number" id="start-delay" class="form-control" value="5000">
          </div>
          <div class="mb-3">
            <label for="animation-speed" class="form-label">Kecepatan Animasi: <span id="speed-value">0.5</span></label>
            <input type="range" class="form-range" min="0.1" max="5" step="0.1" id="animation-speed" value="0.5">
          </div>
          <button onclick="renderHanzi()" class="btn btn-primary w-100">Tampilkan</button>
        </div>
      </div>
    </div>

    <!-- Output Hanzi -->
    <div class="col-md-8 d-flex align-items-center justify-content-center">
      <div id="hanzi-target"></div>
    </div>
  </div>
</div>

<script>
  let writer;

  // Update tampilan label speed saat slider digeser
  document.getElementById('animation-speed').addEventListener('input', function () {
    document.getElementById('speed-value').textContent = this.value;
  });

  function renderHanzi() {
    const char = document.getElementById('hanzi-char').value.trim();
    const strokeDelay = parseInt(document.getElementById('stroke-delay').value);
    const loopDelay = parseInt(document.getElementById('loop-delay').value);
    const startDelay = parseInt(document.getElementById('start-delay').value);
    const animationSpeed = parseFloat(document.getElementById('animation-speed').value);

    if (!char) {
      alert("Masukkan karakter Hanzi.");
      return;
    }

    document.getElementById('hanzi-target').innerHTML = '';

    writer = HanziWriter.create('hanzi-target', char, {
      width: 500,
      height: 500,
      padding: 10,
      showOutline: true,
      delayBetweenStrokes: strokeDelay,
      delayBetweenLoops: loopDelay,
      strokeAnimationSpeed: animationSpeed,
      radicalColor: '#DE2910'
    });

    writer.showOutline();

    setTimeout(() => {
      writer.loopCharacterAnimation();
    }, startDelay);
  }

  // Jalankan otomatis pertama kali
  renderHanzi();
</script>

</body>
</html>
