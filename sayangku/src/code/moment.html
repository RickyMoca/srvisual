<html>
<meta charset='UTF-8' />
<meta content='width=device-width, initial-scale=1, user-scalable=1, minimum-scale=1, maximum-scale=5'
  name='viewport' />
<meta content='IE=edge' http-equiv='X-UA-Compatible' />

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.0.19/dist/sweetalert2.all.min.js"></script>
<script src="script.js"></script>
<link href="style.css" rel="stylesheet" type="text/css" />

<head>
  <title>Seny Indriani </title>
  <link rel="icon" type="image/svg+xml" href="../media/mail.gif">
  <meta name="description" content="Buka bentar yaa.. HTML feeldream.id">
  <meta name="keywords" content="HTML, Bucin, Feeldream">
  <meta name="author" content="Feeldream">

</head>

<body>

  <div id="bodyblur">
    <!-- Wallpaper / Background --><img src="../media/BG.jpg" id="wallpaper" />
  </div>


  <div class="gallery">
    <div class="gallery-item"><img src="../media/Photo/img01.png"alt="Image 1" onclick="openModal(0)"></div>
<div class="gallery-item"><img src="../media/Photo/img02.png"alt="Image 2" onclick="openModal(1)"></div>
<div class="gallery-item"><img src="../media/Photo/img03.png"alt="Image 3" onclick="openModal(2)"></div>

  </div>

  <div id="myModal" class="modal">
    <span class="close" onclick="closeModal()">&times;</span>
    <span class="prev" onclick="changeImage(-1)">&#10094;</span>
    <img class="modal-content" id="img01">
    <span class="next" onclick="changeImage(1)">&#10095;</span>
    <div id="caption"></div>
  </div>



  <script src="sayang-script.js"></script>
  <script src="setting.js"></script>

  <script type="text/javascript">
    audio = new Audio("../media/lagu.mp3");
    audio.play();

    var currentIndex = 0;
    var images = document.querySelectorAll('.gallery-item img');
    var modal = document.getElementById("myModal");
    var modalImg = document.getElementById("img01");
    var captionText = document.getElementById("caption");

    function openModal(index) {
      currentIndex = index;
      modal.style.display = "block";
      modalImg.src = images[currentIndex].src;
      captionText.innerHTML = images[currentIndex].alt;
    }

    function closeModal() {
      modal.style.display = "none";
    }

    function changeImage(direction) {
      currentIndex += direction;

      if (currentIndex < 0) {
        currentIndex = images.length - 1;
      } else if (currentIndex >= images.length) {
        currentIndex = 0;
      }

      modalImg.src = images[currentIndex].src;
      captionText.innerHTML = images[currentIndex].alt;
    }
  </script>

</body>

</html>
