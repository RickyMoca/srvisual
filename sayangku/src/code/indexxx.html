<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animasi Bunga Mawar</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f8ff;
            margin: 0;
        }

        .flower {
            position: relative;
            width: 200px;
            height: 200px;
            animation: grow 5s infinite;
        }

        .petal {
            position: absolute;
            width: 100px;
            height: 150px;
            background: red;
            border-radius: 50% 50% 0 0;
            transform-origin: bottom;
            animation: bloom 5s infinite;
        }

        .petal1 { transform: rotate(0deg); }
        .petal2 { transform: rotate(45deg); }
        .petal3 { transform: rotate(90deg); }
        .petal4 { transform: rotate(135deg); }
        .petal5 { transform: rotate(180deg); }
        .petal6 { transform: rotate(225deg); }
        .petal7 { transform: rotate(270deg); }
        .petal8 { transform: rotate(315deg); }

        .center {
            position: absolute;
            width: 50px;
            height: 50px;
            background-color: yellow;
            border-radius: 50%;
            top: 75px;
            left: 75px;
        }

        @keyframes grow {
            0%, 100% {
                transform: scale(0.9);
            }
            50% {
                transform: scale(1.1);
            }
        }

        @keyframes bloom {
            0%, 100% {
                transform: scale(0.8);
            }
            50% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="flower">
        <div class="petal petal1"></div>
        <div class="petal petal2"></div>
        <div class="petal petal3"></div>
        <div class="petal petal4"></div>
        <div class="petal petal5"></div>
        <div class="petal petal6"></div>
        <div class="petal petal7"></div>
        <div class="petal petal8"></div>
        <div class="center"></div>
    </div>
</body>
</html>
