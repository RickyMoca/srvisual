    <div class="container-mobile " style="background-image: url('{{event.bg}}'); ;">
        <div style="position:absolute;inset:0;z-index:0;background-size:cover;"></div>
        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div style="width:100%;">
                <div class="text-center mb-4 animate__animated animate__fadeInDown animate__slower">
                    <div class="color-accent h4 mb-2 editable font-latin" style="font-size:46px;color:--inv-base;">Assalamulaikum</div>
                </div>
                <div class="editable quotes mb-3 animate__animated animate__fadeInDown animate__slower" style="font-size: 14px;">
                    {{thanks.description}} <br> yang insya allah akan dilaksanakan 
                </div>

                {% for item in event.detail %}
                <div class="mb-4  mt-4 animate__animated {{ item.animate}} animate__slower">
                <div class="text-center row d-flex justify-content-center">
                    <div class="card ticket-date inv-base p-4" style="width:90px;">
                        <div>{{ item.date}}</div>
                    </div>
                    <div class="ticket-body text-left card p-4" style="width: 50%;">
                        <div class="font-latin" style="font-size:30px;">{{ item.name}}</div>
                        <div  style="font-size:12px;"><i class='bx bx-time-five i-couple'></i> {{ item.time}}</div>
                        <div  style="font-size:12px;"><i class='bx bx-map i-couple'></i> {{ item.location}}</div>
                        <div  style="font-size:12px;"><i class='bx bx-notepad i-couple'></i> {{ item.description}}</div>
                    </div>
                    </div>
                </div>
                {% endfor %}
            
            </div> 
        </div>
        <div class="floating-stempel img-stempel"><img src="assets/img/img-bg/img-stempel.webp" alt="assets/img/img-bg/img-stempel.webp"></div>
    </div>
