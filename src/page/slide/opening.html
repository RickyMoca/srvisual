{% for item in opening %}
    <div class="container-mobile" style="background-image: url('{{item.bg}}'); position: relative; background-size: cover; background-position: center; background-repeat: no-repeat;">

        <div class="d-flex justify-content-center align-items-center" style="height: 100%;">
            <div class="text-center" style="width: 100%;">
                <div class="polaroid mb-2 mx-auto animate__animated animate__fadeInDown animate__slower" style="height:200p;width:200px;overflow:hidden;">
                    <img src="{{ item.img }}" style="width: 100%;height: 100%;object-fit: cover;" alt="no-image.jpg" />
                    <p class="font-latin opening-name">Seny & Ricky</p>
                </div>
        
                <div style="width:100%;">
                    <div class="text-center animate__animated animate__fadeInUp animate__slower">

                        <div class="editable" style="font-size:12.4px;">
                            <div class="card-quote">
                                {{ item.quote }}
                                <br /><br />

                                <p class="subtitle-quote">{{ item.tagQuote }}</p>
                            </div>


                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endfor %}
