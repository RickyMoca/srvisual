   <!-- startRSVPModal -->
   <div class="modal fade bg-dark" id="rsvpModal" tabindex="-1" role="dialog" aria-labelledby="rsvpModal">
   
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content p-4" style="height:100%">
            <div class="text-center mb-4 animate__animated animate__fadeInDown animate__slower">
                <div class="color-accent h4 mb-2 editable font-latin" style="font-size:46px;color:--inv-base;">RSVP</div>
            </div>

            <form  id="rsvpForm" class="formContainer p-2 mb-2 rounded-lg shadow-lg">
                <!-- Name Field -->
                <div class="form-group mb-2">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" class="form-control input-field" placeholder="Nama anda" required>
                </div>
            
                <!-- Message Field -->
                <div class="form-group mb-2">
                    <label for="message">Berikan Ucapan</label>
                    <textarea id="message" name="message" class="form-control input-field" rows="4" placeholder="Pesan untuk mempelai" required></textarea>

                <!-- Attendance and Total in the same row -->
                <div class="form-row mb-2">
                    <div class="col-md-6">
                        <div class="form-group">
                            <label for="attendance">Apakah anda akan hadir ?</label>
                            <select id="attendance" name="attendance" class="form-control input-field" required>
                                <option value="Hadir">Hadir</option>
                                <option value="Tidak Hadir">Tidak Hadir</option>
                            </select>
                        </div>
                    </div>
            
                    <div class="col-md-6">
                        <div class="form-group" id="frm-total">
                            <label for="total">Jumlah tamu</label>
                            <select id="total" name="total" class="form-control input-field" required>
                                <option value="1">1</option>
                                <option value="2">2</option>
                                <option value="3">3</option>
                                <option value="4">4</option>
                                <option value="5">5</option>
                            </select>
                        </div>
                    </div>
                </div>
            
                <!-- Submit Button -->

                    <button id="submitButton" type="submit" class="btnSubmit btn btn-block animate__animated">Submit</button>
